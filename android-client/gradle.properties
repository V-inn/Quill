# 4096, not the 2048 that was sized for the Kotlin 1.9 compiler: K2 and R8
# 8.11 in one daemon on this module is tight at 2048, and it does not fail
# with anything that names the cause -- it is an opaque heap OutOfMemoryError,
# or a Gradle daemon that simply disappears mid-build.
org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
